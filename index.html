<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>כשר מירון</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0d2b33"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=Frank+Ruhl+Libre:wght@700;900&display=swap">
<style>
html{color-scheme:light}
/* פריסה: סרגל לשוניות עליון, אזור עבודה אחד. מסך הנציג הוא ברירת המחדל. */
:root{
  --bg:#eef1f2; --surface:#ffffff; --ink:#15222b; --muted:#5b6b75; --line:#d5dde1;
  --accent:#0e6a6a; --accent-ink:#ffffff; --accent-soft:#d9eeee;
  --ok:#1f7a3d; --ok-soft:#dcf1e3; --warn:#9a5b00; --warn-soft:#fbebcf; --bad:#a3262a; --bad-soft:#f8dcdd;
  --font-ui:'Heebo',system-ui,sans-serif; --font-display:'Frank Ruhl Libre','Heebo',serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f181d; --surface:#17232a; --ink:#e6eef1; --muted:#93a5af; --line:#2a3b44;
  --accent:#4fc3c3; --accent-ink:#06201f; --accent-soft:#16393a;
  --ok:#6fd08c; --ok-soft:#173a25; --warn:#f0b35a; --warn-soft:#3d2c0f; --bad:#ff8a8d; --bad-soft:#41191b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f181d; --surface:#17232a; --ink:#e6eef1; --muted:#93a5af; --line:#2a3b44;
  --accent:#4fc3c3; --accent-ink:#06201f; --accent-soft:#16393a;
  --ok:#6fd08c; --ok-soft:#173a25; --warn:#f0b35a; --warn-soft:#3d2c0f; --bad:#ff8a8d; --bad-soft:#41191b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.5;margin:0}
:root{--side:#0d2b33;--side-ink:#cfe0e4;--side-mute:#7f9aa2;--gold:#d4a24c;--shadow:0 1px 2px rgba(13,43,51,.06),0 6px 20px rgba(13,43,51,.06)}
.app{display:flex;min-height:100vh}
.side{width:244px;flex:none;background:linear-gradient(180deg,#0d2b33 0%,#0a2027 100%);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:30}
.brand{display:flex;align-items:center;gap:11px;padding:22px 20px 18px}
.brand svg{flex:none}
.brand b{display:block;font-family:var(--font-display);font-size:21px;font-weight:900;color:#fff;line-height:1.1}
.brand small{display:block;font-size:11px;letter-spacing:.14em;color:var(--gold);margin-top:3px}
#tabs{padding:4px 12px 12px;flex:1}
.grp{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--side-mute);padding:16px 10px 6px;display:flex;align-items:center;gap:7px}
.grp svg{opacity:.8}
#tabs button{display:block;width:100%;text-align:right;border:0;background:transparent;color:var(--side-ink);font:500 14.5px var(--font-ui);padding:9px 12px;border-radius:9px;cursor:pointer;margin:1px 0;position:relative}
#tabs button:hover{background:rgba(255,255,255,.07);color:#fff}
#tabs button[aria-selected="true"]{background:rgba(212,162,76,.16);color:#fff;font-weight:700}
#tabs button[aria-selected="true"]::before{content:"";position:absolute;right:-12px;top:7px;bottom:7px;width:3px;border-radius:3px;background:var(--gold)}
.sidefoot{padding:14px 18px 18px;border-top:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:10px}
.sidefoot .sub{color:var(--side-mute);font-size:12px}
.sidefoot .btn{background:rgba(255,255,255,.08);color:var(--side-ink);border-color:rgba(255,255,255,.14)}
.sidefoot .btn:hover{background:rgba(255,255,255,.15);border-color:var(--gold)}
.mainc{flex:1;min-width:0}
.topbar{display:flex;align-items:center;gap:12px;padding:16px 28px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topbar h1{font-family:var(--font-display);font-weight:900;font-size:24px;margin:0;flex:1}
.menu-btn{display:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;width:42px;height:42px;cursor:pointer;align-items:center;justify-content:center}
.wrap{max-width:1180px;margin:0 auto;padding:24px 28px 56px}
.scrim{display:none}
@media (max-width:900px){
  .side{position:fixed;right:0;top:0;transform:translateX(105%);transition:transform .25s ease;width:274px;box-shadow:-10px 0 40px rgba(0,0,0,.35)}
  body.menu-open .side{transform:none}
  body.menu-open .scrim{display:block;position:fixed;inset:0;background:rgba(5,15,18,.55);z-index:25}
  .menu-btn{display:inline-flex}
  .topbar{padding:10px 14px}
  .topbar h1{font-size:20px}
  .wrap{padding:14px 14px 48px}
}
.sub{color:var(--muted);font-size:13px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);outline:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.stack{display:flex;flex-direction:column;gap:14px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
input,select,textarea{font:400 16px var(--font-ui);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;transition:border-color .15s,box-shadow .15s;padding:10px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:64px}
.btn{font:500 15px var(--font-ui);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:linear-gradient(180deg,var(--accent),color-mix(in srgb,var(--accent) 82%,#000));color:var(--accent-ink);border-color:var(--accent);font-weight:700;box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn{transition:all .15s}.btn:active{transform:translateY(1px)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
h2{font-family:var(--font-display);font-size:21px;margin:0 0 6px}
h3{font-size:15px;margin:0}
.opt{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.opt.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.opt .info{min-width:0;flex:1 1 220px}
.meta{color:var(--muted);font-size:13px}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:500;background:var(--accent-soft);color:var(--ink)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;font-size:14px;vertical-align:middle}
th{color:var(--muted);font-weight:700;font-size:12px;white-space:nowrap;background:var(--bg)}
tbody tr:hover td{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
td.num,th.num{font-variant-numeric:tabular-nums}
.cell{border:0;width:100%;min-width:92px;padding:8px 6px;border-radius:6px;font:500 12px var(--font-ui);cursor:pointer;text-align:center}
.cell.free{background:var(--ok-soft);color:var(--ok)}
.cell.busy{background:var(--bad-soft);color:var(--bad);cursor:default}
.cell.part{background:var(--warn-soft);color:var(--warn);cursor:default}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:26px;font-variant-numeric:tabular-nums;font-family:var(--font-display)}
.stat span{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:5px 12px;border-radius:99px;font:400 13px var(--font-ui);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.note{font-size:13px;padding:10px 12px;border-radius:8px;background:var(--warn-soft);color:var(--warn)}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;font-size:14px;z-index:20}
.dcell{width:26px;min-width:26px;height:28px;border:0;border-radius:4px;font-size:10px;padding:0;cursor:pointer}
.dcell.free{background:var(--ok-soft)} .dcell.busy{background:var(--bad);cursor:default} .dcell.part{background:var(--warn);cursor:default}
.dh{font-size:10px;padding:2px;text-align:center;min-width:26px} .dh.we{color:var(--accent);font-weight:700}
.barrow{display:flex;gap:10px;align-items:center;margin:6px 0} .barrow>span:first-child{width:92px;font-size:13px;flex:none}
.barwrap{background:var(--bg);border-radius:6px;flex:1;height:14px;min-width:0} .bar{height:14px;background:var(--accent);border-radius:6px;min-width:2px}
.barrow>span:last-child{width:110px;font-size:12px;color:var(--muted);flex:none}
.alert{padding:8px 12px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:14px;margin-bottom:6px}
.panel{min-width:0;max-width:100%}
#d_t,#o_clean,#a_roi,#l_p,#l_c,#bl_t,#lg_t,#fin_t,#e_list,#pay_t{overflow-x:auto}
.login{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh}
.login-art{position:relative;overflow:hidden;background:linear-gradient(rgba(7,26,32,.55),rgba(7,26,32,.55)),url(rashbi.jpg) center/cover,radial-gradient(900px 500px at 80% 10%,#1d5260 0%,transparent 60%),linear-gradient(160deg,#0d2b33,#071a20);color:#dbe9ec;padding:48px;display:flex;flex-direction:column;justify-content:center;gap:18px}
.login-brand svg{flex:none;width:44px;height:44px}
.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.login-brand b{display:block;font-family:var(--font-display);font-size:26px;font-weight:900;color:#fff;line-height:1.1}
.login-brand small{display:block;font-size:11px;letter-spacing:.16em;color:#d4a24c;margin-top:3px}
.login-scene{position:absolute;left:0;right:0;bottom:0;width:100%;height:42%;pointer-events:none}
.login-art h2,.login-art p,.login-brand{position:relative;z-index:1}
.login-art h2{font-family:var(--font-display);font-size:38px;line-height:1.2;color:#fff;margin:0}
.login-art p{font-size:16px;max-width:420px;color:#a9c3c9;margin:0}
.login-form{display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px}
.login-card h3{font-family:var(--font-display);font-size:26px}
@media (max-width:800px){.login{grid-template-columns:1fr}.login-art{padding:28px 22px;min-height:0}.login-art h2{font-size:26px}.login-art p{display:none}.login-brand{margin-bottom:6px}.login-form{align-items:flex-start;padding:24px 22px}}
.bdg{display:inline-block;min-width:20px;padding:0 6px;margin-inline-start:8px;border-radius:99px;background:var(--gold);color:#0d2b33;font-size:12px;font-weight:700;text-align:center;line-height:20px}
.qs{width:200px;max-width:40vw;padding:8px 12px!important;font-size:14px!important;border-radius:99px!important}
a.btn{text-decoration:none;display:inline-block}
main a:not(.btn){color:var(--accent)}
body.ro .btn.primary,body.ro .btn.danger{display:none!important}
body.ro .topbar::after{content:'צפייה בלבד';font-size:12px;font-weight:700;color:var(--warn);background:var(--warn-soft);padding:3px 10px;border-radius:99px}
@media print{.side,.topbar,.noprint,.toast,.scrim{display:none!important}.wrap{padding:0;max-width:none}body{background:#fff}.panel{box-shadow:none;border:0}.app{display:block}}
[hidden]{display:none!important}
</style>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div class="app" id="appwrap" hidden>
  <aside class="side" id="side">
    <div class="brand"><svg width="40" height="40" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="13" fill="#10161d"/><path d="M10.5 18 a8.5 8.5 0 0 1 17 0Z" fill="#33d6c0"/><path d="M25 18 a6.5 6.5 0 0 1 13 0Z" fill="#1fb8a8"/><rect x="9" y="20.5" width="30" height="2" rx="1" fill="#f1e8d0"/><path d="M15.5 41 V32.5 a8.5 8.5 0 0 1 17 0 V41" fill="none" stroke="#f1e8d0" stroke-width="2.8"/><path d="M21 41 V36 a3 3 0 0 1 6 0 V41Z" fill="#d4a24c"/></svg>
<div><b>כשר מירון</b><small>KASHER MERON</small><span class="desc">אירוח ונכסים · מירון</span></div></div>
    <nav role="tablist" id="tabs" aria-label="תפריט ראשי"></nav>
    <div class="sidefoot"><span class="sub" id="status">טוען נתונים…</span><div id="sidebtns"></div></div>
  </aside>
  <div class="mainc">
    <div class="topbar">
      <button class="menu-btn" id="menubtn" aria-label="תפריט"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <h1 id="pagetitle">דשבורד</h1>
    </div>
    <div class="wrap"><main id="view"></main></div>
  </div>
</div>
<div class="scrim" id="scrim"></div>
<div class="toast" id="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="adapter.js"></script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){})</script>
</body>
</html>
