name: Supabase keep-alive

# מונע השהיה של מסד Supabase (תוכנית חינמית) בגלל חוסר פעילות.
# שאילתת קריאה קלה אחת, שלוש פעמים בשבוע. המפתח הוא ה-anon הציבורי
# שכבר מופיע ב-config.js, והנתונים מוגנים ב-RLS.

on:
  schedule:
    - cron: "17 6 * * 1,3,5"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: https://nasqvwzvgwvchfjjrygq.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5hc3F2d3p2Z3d2Y2hmampyeWdxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1NjI0NjAsImV4cCI6MjEwOTEzODQ2MH0.1zSQ_sM5cDUw38BcnxanYrfsak1UdEBDaayaDs2Hw2I
        run: |
          code=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" --retry 3 --retry-delay 10 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/docs?select=id&limit=1")
          echo "HTTP $code"
          cat /tmp/resp.txt
          # כל תשובה שאינה שגיאת שרת (5xx) מוכיחה שהמסד ער ונענה
          if [ "$code" -ge 500 ] || [ "$code" -eq 0 ]; then
            echo "Supabase did not respond properly" >&2
            exit 1
          fi
